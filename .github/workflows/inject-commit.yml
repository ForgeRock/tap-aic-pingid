name: Inject commit hash into JS files

on:
  push:
    branches: [main]
    paths:
      - '**.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update JS headers
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | while IFS= read -r file; do

              tmpfile="$(mktemp)"

              awk -v sha="$SHORT_SHA" '
                BEGIN { inserted = 0 }

                /^ \* Commit:/ {
                  print " * Commit: " sha
                  inserted = 1
                  next
                }

                NR == 1 && $0 == "/**" {
                  print
                  next_line = 1
                  next
                }

                next_line == 1 {
                  if ($0 !~ /^ \* Commit:/ && inserted == 0) {
                    print " * Commit: " sha
                    inserted = 1
                  }
                  print
                  next_line = 0
                  next
                }

                { print }
              ' "$file" > "$tmpfile"

              mv "$tmpfile" "$file"
            done

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add '*.js'
          git commit -m "Update JS commit headers [skip ci]"
          git push
